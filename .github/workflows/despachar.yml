# Despacha os vídeos da grade para o Buffer, de hora em hora, sem precisar do PC ligado.
# Instalado no repositório de vídeos por: node publicar/semana.mjs instalar
# Repositório público: minutos do GitHub Actions são grátis.
name: despachar

on:
  schedule:
    - cron: "17 * * * *"   # todo minuto 17 (UTC); o GitHub pode atrasar e até pular execuções
    # Instagram direto só sai se o despachante estiver rodando perto do horário. Como o GitHub
    # atrasa o cron de hora em hora (em 15/11 ficou 8 h sem rodar), há tentativas extras antes
    # de cada horário: 09:00, 12:00 e 17:00 de Brasília = 12, 15 e 20 UTC.
    - cron: "5,25,40,50 11,14,19 * * *"
  workflow_dispatch: {}      # botão "Run workflow" para rodar na hora

permissions:
  contents: write            # gravar grade.json e apagar vídeos da release

concurrency:
  group: despachar
  cancel-in-progress: false

jobs:
  despachar:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # Instagram direto: prepara o vídeo e espera o horário do post
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node despachar.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUFFER_CONFIG: ${{ secrets.BUFFER_CONFIG }}
          INSTAGRAM_CONFIG: ${{ secrets.INSTAGRAM_CONFIG }}
